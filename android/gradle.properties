org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Yandex MapKit varianti. `lite` faqat xarita ko'rsatadi; manzil qidiruv
# (YandexSearch/YandexSuggest) va marshrut (YandexDriving) kanallari faqat
# `full` variantda ro'yxatdan o'tadi. app/build.gradle.kts dagi
# `com.yandex.android:maps.mobile` versiyasi shu variant bilan mos bo'lishi shart.
yandexMapkit.variant=full
